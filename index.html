<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>Lista Eveniment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface2: #1e1e1e;
  --border: #2a2a2a;
  --border2: #333;
  --text: #f0ede8;
  --text2: #888;
  --text3: #555;
  --accent: #c8f060;
  --accent-dim: rgba(200,240,96,0.12);
  --accent-text: #0a1800;
  --danger: #ff5c5c;
  --radius: 12px;
  --radius-sm: 7px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
body { padding-bottom: 120px; }

.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13,13,13,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px;
}
.header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.header-title { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: var(--text2); text-transform: uppercase; }
.btn-reset {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: transparent;
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 5px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  opacity: 0.7;
  transition: opacity .2s, background .2s;
}
.btn-reset:active { opacity: 1; background: rgba(255,92,92,0.12); }

.progress-row { display: flex; align-items: center; gap: 12px; }
.progress-bar {
  flex: 1;
  height: 4px;
  background: var(--surface2);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width .4s cubic-bezier(.4,0,.2,1);
}
.progress-text {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  min-width: 52px;
  text-align: right;
}

.content { padding: 20px 20px 0; }

.category { margin-bottom: 10px; }
.cat-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--surface);
  border-radius: var(--radius-sm);
  margin-bottom: 2px;
  border: 1px solid var(--border);
}
.cat-icon { font-size: 18px; line-height: 1; }
.cat-name {
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text2);
  flex: 1;
}
.cat-badge {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--surface2);
  color: var(--text3);
  border: 1px solid var(--border);
  transition: all .2s;
}
.cat-badge.done {
  background: var(--accent-dim);
  color: var(--accent);
  border-color: rgba(200,240,96,0.3);
}

.items-block {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
  user-select: none;
  -webkit-user-select: none;
}
.item:last-child { border-bottom: none; }
.item:active { background: var(--surface2); }
.item.checked { background: rgba(200,240,96,0.03); }

.check-box {
  width: 20px;
  height: 20px;
  border-radius: 5px;
  border: 1.5px solid var(--border2);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s;
  background: transparent;
}
.check-box.on {
  background: var(--accent);
  border-color: var(--accent);
}
.check-icon {
  display: none;
  width: 11px;
  height: 8px;
}
.check-icon path { stroke: var(--accent-text); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
.check-box.on .check-icon { display: block; }

.item-name {
  font-size: 15px;
  font-weight: 400;
  color: var(--text);
  flex: 1;
  transition: color .2s;
  line-height: 1.3;
}
.item.checked .item-name {
  color: var(--text3);
  text-decoration: line-through;
  text-decoration-color: var(--text3);
}

.footer-space { height: 30px; }

.all-done-banner {
  display: none;
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: var(--accent-text);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.05em;
  padding: 12px 24px;
  border-radius: 99px;
  white-space: nowrap;
  z-index: 200;
  animation: slideUp .3s ease;
}
.all-done-banner.visible { display: block; }
@keyframes slideUp {
  from { opacity: 0; transform: translateX(-50%) translateY(12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <span class="header-title">Lista eveniment</span>
    <button class="btn-reset" onclick="resetAll()">↺ Reset</button>
  </div>
  <div class="progress-row">
    <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
    <span class="progress-text" id="progText">0 / 0</span>
  </div>
</div>

<div class="content" id="listRoot"></div>
<div class="footer-space"></div>
<div class="all-done-banner" id="doneBanner">✓ Totul e pregătit!</div>

<script>
const CATEGORIES = [
  { icon: "📷", name: "Camere & accesorii", items: [
    "Sony A7S3 #1", "Sony A7S3 #2",
    "Baterie Sony #1", "Baterie Sony #2", "Baterie Sony #3", "Baterie Sony #4",
    "Încărcător Sony #1", "Încărcător Sony #2",
    "Case cu carduri", "Șervețele obiective"
  ]},
  { icon: "🔭", name: "Obiective", items: [
    "Sigma 24-70mm f/2.8", "Sigma 35mm f/1.4",
    "Viltrox 85mm f/1.8", "Tamron 20-40mm f/2.8"
  ]},
  { icon: "🎯", name: "Stabilizare & suport", items: [
    "Gimbal Ronin RS2", "Gimbal Crane M3S",
    "Monopied", "Chei lucru cage & accesorii"
  ]},
  { icon: "🚁", name: "Drona", items: ["Drona"] },
  { icon: "🖥️", name: "Monitor & înregistrare", items: [
    "Monitor Shinobi II",
    "Baterie monitor #1", "Baterie monitor #2",
    "Încărcător baterie monitor",
    "Recorder Zoom H4n", "Cabluri recorder"
  ]},
  { icon: "🎙️", name: "Audio", items: [
    "Lavaliere Hollyland", "Microfon extern", "Baterii de unică folosință"
  ]},
  { icon: "💻", name: "Laptop & accesorii", items: [
    "Geantă laptop", "Laptop", "Încărcător laptop",
    "SSD extern", "Căști", "Mouse", "Hub USB"
  ]},
  { icon: "🔌", name: "Power & cabluri", items: [
    "Încărcător principal Ugreen", "Cabluri USB-C"
  ]},
  { icon: "📄", name: "Documente", items: ["Contracte"] }
];

const KEY = "eventList_v2";
let state = {};

function load() {
  try { const s = localStorage.getItem(KEY); if(s) state = JSON.parse(s); } catch(e){}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}
function ikey(ci, ii) { return ci+"_"+ii; }

function toggle(ci, ii) {
  const k = ikey(ci, ii);
  state[k] = !state[k];
  save();
  render();
}

function resetAll() {
  if(!confirm("Resetezi toată lista?")) return;
  state = {};
  save();
  render();
}

function render() {
  let total = 0, checked = 0;
  CATEGORIES.forEach((cat, ci) => {
    cat.items.forEach((_, ii) => { total++; if(state[ikey(ci,ii)]) checked++; });
  });

  const pct = total ? Math.round(checked / total * 100) : 0;
  document.getElementById("progFill").style.width = pct + "%";
  document.getElementById("progText").textContent = checked + " / " + total;

  const banner = document.getElementById("doneBanner");
  if(checked === total && total > 0) {
    banner.classList.add("visible");
  } else {
    banner.classList.remove("visible");
  }

  const root = document.getElementById("listRoot");
  root.innerHTML = "";

  CATEGORIES.forEach((cat, ci) => {
    const catChecked = cat.items.filter((_,ii) => state[ikey(ci,ii)]).length;
    const allDone = catChecked === cat.items.length;

    const div = document.createElement("div");
    div.className = "category";
    div.innerHTML = `
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-name">${cat.name}</span>
        <span class="cat-badge${allDone?" done":""}">${catChecked}/${cat.items.length}</span>
      </div>
      <div class="items-block">
        ${cat.items.map((item, ii) => {
          const on = !!state[ikey(ci,ii)];
          return `<div class="item${on?" checked":""}" onclick="toggle(${ci},${ii})">
            <div class="check-box${on?" on":""}">
              <svg class="check-icon" viewBox="0 0 11 8"><path d="M1 4l3 3 6-6"/></svg>
            </div>
            <span class="item-name">${item}</span>
          </div>`;
        }).join("")}
      </div>`;
    root.appendChild(div);
  });
}

load();
render();
</script>
</body>
</html>
